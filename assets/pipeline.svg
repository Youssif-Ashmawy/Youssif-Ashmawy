<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2027"/><stop offset=".55" stop-color="#16303a"/><stop offset="1" stop-color="#1c3a48"/>
  </linearGradient>
  <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#36BCF7"/><stop offset="1" stop-color="#9F7AEA"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
    <path d="M22 0H0V22" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
</defs>
<style>
  .flow{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
  .fb{stroke-dasharray:4 8;animation:dash 0.9s linear infinite reverse}
  @keyframes dash{to{stroke-dashoffset:-16}}
  .num{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;font-weight:700}
  .t{fill:#ffffff;font-size:16px;font-weight:700}
  .s{fill:#a9c1cc;font-size:11.5px}
  .live{animation:blink 1.4s ease-in-out infinite}
  @keyframes blink{50%{opacity:.15}}
  .bar{animation:train 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
  @keyframes train{0%{transform:scaleX(.05)}80%,100%{transform:scaleX(1)}}
  .hdr{fill:#e6f4fa;font-size:14px;font-weight:600;letter-spacing:.5px}
  .sub{fill:#7fa3b3;font-family:'JetBrains Mono',Consolas,monospace;font-size:11px}
</style>
<rect width="880" height="340" rx="16" fill="url(#bg)"/>
<rect width="880" height="340" rx="16" fill="url(#grid)"/>
<text x="30" y="36" class="hdr">ML PIPELINE · NOTEBOOK → PRODUCTION</text>
<text x="850" y="36" text-anchor="end" class="sub"><tspan fill="#48BB78">●</tspan> running</text>
<path d="M118,108 H754 V262 H118" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="6" stroke-linejoin="round"/>
<path d="M118,108 H754 V262 H118" fill="none" stroke="url(#flow)" stroke-width="2.2" stroke-linejoin="round" class="flow"/>
<path id="fbp" d="M118,221.0 C118,185.0 330,185.0 330,149.0" fill="none" stroke="#F56565" stroke-opacity=".75" stroke-width="1.8" class="fb"/>
<text x="246.0" y="207.0" class="sub" fill="#F59E9E">drift → retrain</text>
<g>
